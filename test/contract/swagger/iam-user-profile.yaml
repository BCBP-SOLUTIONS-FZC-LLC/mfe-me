basePath: /api/v1
definitions:
  github_com_BCBP-SOLUTIONS-FZC-LLC_platform-gincommon_v2_internal_problem.FieldError:
    properties:
      field:
        description: Field is the JSON path of the invalid field (e.g. "deadline",
          "items[0].sku").
        type: string
      message:
        description: |-
          Message is a fixed phrase ("is required", "must be in the future"). It never
          echoes the rejected value, which may be PII.
        type: string
    type: object
  http.AvailabilityResp:
    properties:
      delegate_user_id:
        example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        format: uuid
        type: string
      note:
        example: Annual leave
        type: string
      ooo_from:
        example: "2026-07-01T00:00:00Z"
        format: date-time
        type: string
      ooo_until:
        example: "2026-07-14T23:59:59Z"
        format: date-time
        type: string
      status:
        allOf:
        - $ref: '#/definitions/http.AvailabilityStatus'
        example: ooo
    type: object
  http.AvailabilityResponse:
    properties:
      delegate_user_id:
        example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        format: uuid
        type: string
      note:
        example: Annual leave
        type: string
      ooo_from:
        example: "2026-07-01T00:00:00Z"
        format: date-time
        type: string
      ooo_until:
        example: "2026-07-14T23:59:59Z"
        format: date-time
        type: string
      record_version:
        example: 2
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/http.AvailabilityStatus'
        example: ooo
      updated_at:
        example: "2026-01-01T00:00:00Z"
        format: date-time
        type: string
      user_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        format: uuid
        type: string
    type: object
  http.AvailabilityStatus:
    enum:
    - available
    - busy
    - ooo
    type: string
    x-enum-varnames:
    - AvailabilityStatusAvailable
    - AvailabilityStatusBusy
    - AvailabilityStatusOOO
  http.BatchRequest:
    properties:
      ids:
        items:
          format: uuid
          type: string
        maxItems: 200
        minItems: 1
        type: array
    required:
    - ids
    type: object
  http.BatchUsersResponse:
    properties:
      missing:
        items:
          format: uuid
          type: string
        type: array
      pagination:
        $ref: '#/definitions/http.PaginationMeta'
      users:
        items:
          $ref: '#/definitions/http.UserResponse'
        type: array
    type: object
  http.ConfirmSignatureRequest:
    properties:
      expected_version:
        example: 1
        minimum: 1
        type: integer
      object_key:
        example: f0e1d2c3-b4a5-6789-0fed-cba987654321/signatures/sig.png
        maxLength: 500
        minLength: 1
        type: string
      sha256:
        example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        type: string
    required:
    - object_key
    - sha256
    type: object
  http.LLMContextResponse:
    properties:
      context_documents:
        items:
          type: string
        type: array
      credentials:
        additionalProperties:
          type: string
        type: object
      display_name:
        example: Alice Smith
        type: string
      job_title:
        example: Staff Engineer
        type: string
      locale:
        example: en-US
        type: string
      preferred_model:
        example: claude-opus-4-7
        type: string
      templates:
        items:
          type: string
        type: array
      timezone:
        example: America/New_York
        type: string
      user_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        format: uuid
        type: string
      writing_tone:
        allOf:
        - $ref: '#/definitions/http.WritingTone'
        example: technical
    type: object
  http.LLMPrefsResponse:
    properties:
      context_documents:
        items:
          type: string
        type: array
      preferred_model:
        example: claude-opus-4-7
        type: string
      record_version:
        example: 2
        type: integer
      templates:
        items:
          type: string
        type: array
      updated_at:
        example: "2026-01-01T00:00:00Z"
        format: date-time
        type: string
      writing_tone:
        allOf:
        - $ref: '#/definitions/http.WritingTone'
        example: technical
    type: object
  http.NotifPrefItem:
    properties:
