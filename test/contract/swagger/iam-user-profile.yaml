host: localhost:8080
info:
  contact:
    email: sharmila.dayalan@bcbpsolutions.com
    name: BCBP Solutions
  description: |-
    User profile microservice — owns display identity, availability, LLM preferences, notification preferences, and approver signatures.

    **Tenant isolation:** All resource access is strictly scoped by x-tenant-id. Cross-tenant access is never permitted.
  license:
    name: Proprietary
  title: IAM User Profile API
  version: "1.0"
paths:
  /internal/users:
    post:
      consumes:
      - application/json
      description: 'Creates a user profile from a Keycloak user-created event, or
        enriches the provisional stub left by a first login. Idempotent: a user that
        is already fully provisioned is returned unchanged (200, no event). 409 user_already_exists
        when the email/username belongs to another user in the tenant; 409 duplicate_request
        while another request with the same Idempotency-Key is in flight. tenant_id
        must equal the x-tenant-id header (400 tenant_mismatch). email must be a valid
        fully-lowercase RFC 5322 address (RFC 5321: max 254 chars total, local part
        ≤ 64 chars; RFC 5322: no consecutive dots, no leading/trailing dot in local
        part; TLD ≥ 2 chars; ASCII domain only — IDN must be punycode-encoded). display_name
        must be 1-200 chars with no control characters (optional). Supply Idempotency-Key
        to make the call safe for event-retry: the first successful 200 response is
        cached for 24h and returned verbatim on subsequent calls with the same key
        and body (a different body is 422 idempotency_key_reuse). Response status
        is 200 OK (LLD §8.8.15 sequence).'
      parameters:
      - description: Required. Client-generated idempotency key (UUID recommended,
          max 128 chars). Blank or missing → 400 invalid_idempotency_key. Successful
          responses are cached for 24h; retries with the same key return the original
          200 without re-executing.
        format: uuid
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: User provisioning payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ProvisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: invalid_idempotency_key (blank/missing header or > 128 chars),
            invalid_request, tenant_mismatch, bad_request
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "403":
          description: caller lacks the iam-system role
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "409":
          description: user_already_exists, duplicate_request (concurrent same-key),
            version_conflict
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "422":
          description: input validation failed (email format or display_name), or
            idempotency_key_reuse
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemDetails'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: Provision user (internal)
      tags:
      - Internal
  /internal/users/{id}:
    delete:
      description: Soft-deletes the user profile and replaces PII fields with anonymous
        placeholders (GDPR right to erasure). Triggered by a Keycloak user-deleted
        event. Returns 200 OK per LLD §8.8.17 (idempotent — repeated deletes for the
        same or a non-existent user id also return 200; 404 is never returned).
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK — deleted, or already deleted/non-existent (idempotent)
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "403":
          description: caller lacks the iam-system role
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemDetails'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: Delete user (internal)
      tags:
      - Internal
    patch:
      consumes:
      - application/json
      description: 'Updates identity fields (email, username, display name, job title,
        attributes) derived from a Keycloak user-updated event. If provided, email
        must be a valid fully-lowercase RFC 5322 address (RFC 5321: local part ≤ 64
        chars, max 254 total; RFC 5322: no consecutive dots, no leading/trailing dot
        in local part; TLD ≥ 2 chars; ASCII domain only) and display_name must be
        1-200 chars with no control characters. `event_time` is intended for the Event
        Consumer only — it is the Keycloak webhook envelope timestamp used by the
        recency guard (LLD §8.8.16); direct callers should omit it. When `event_time`
        is supplied but is <= `users.last_idp_sync_at`, the patch is silently accepted
        as a no-op (HTTP 200 with the unchanged record) and the response carries `X-IdP-Sync-Skipped:
        true`.'
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Identity fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.PatchIdentityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "403":
          description: caller lacks the iam-system role
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "422":
          description: input validation failed (email or display_name)
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemDetails'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: Patch user identity (internal)
      tags:
      - Internal
  /internal/users/{id}/availability:
    put:
      consumes:
      - application/json
      description: Identical behaviour to PUT /users/{id}/availability but callable
        by iam-system callers without the self-or-admin restriction (gated at the
        network layer by RequireSystemRole middleware).
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Availability payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.PutAvailabilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AvailabilityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "403":
          description: caller lacks the iam-system role
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "422":
          description: input validation failed (ooo_window)
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemDetails'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
