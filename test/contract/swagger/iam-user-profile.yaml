  /users/{id}/signature:
    delete:
      description: Marks the signature for durable erasure (signature_erasure_pending=true);
        does not delete the S3 object synchronously. The signature-erasure reconciler
        CronJob deletes all object versions in both the primary and CRR replica buckets
        and clears the pending flag on confirmed erasure (LLD §8.7 K2). No-op if the
        user has no signature.
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemDetails'
      security:
      - UserID: []
      - TenantID: []
      summary: Delete user signature
      tags:
      - Signature
    post:
      consumes:
      - application/json
      description: 'Returns a short-lived presigned S3 PUT URL. Accepted content types:
        image/png, image/jpeg. The presigned URL is signed for the exact Content-Type
        supplied — the PUT request to S3 must include that same Content-Type header
        or S3 will reject the upload with 403 SignatureDoesNotMatch (MIME spoofing
        is prevented at the S3 layer). Maximum upload size: 1 MB (1,048,576 bytes)
        — ConfirmSignature enforces this server-side (413 if exceeded). Rate-limited
        to 10 requests per minute per user, enforced via a shared Valkey counter so
        the limit is consistent across all replicas. X-RateLimit-Limit, X-RateLimit-Remaining,
        and X-RateLimit-Reset headers are set on every response. **Strict JSON binding:**
        unknown fields in the request body return 400 BAD_REQUEST.'
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Content type for the upload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.PresignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per burst window
              type: integer
            X-RateLimit-Remaining:
              description: Remaining requests in current window
              type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the limit fully resets
              type: integer
          schema:
            $ref: '#/definitions/http.PresignResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "409":
          description: signature_erasure_pending — the previous signature is still
            being erased
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "429":
          description: Too Many Requests
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per burst window
              type: integer
            X-RateLimit-Remaining:
              description: Remaining requests (0 when rate-limited)
              type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the limit resets
              type: integer
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemDetails'
      security:
      - UserID: []
      - TenantID: []
      summary: Request signature upload URL
      tags:
      - Signature
    put:
      consumes:
      - application/json
      description: Verifies the SHA-256 hash of the uploaded object against the server-side
        hash, then records the signature key on the user profile. Returns 201 on first
        upload, 200 on replace. signature_image_hash must be 64 lowercase hex chars
        (SHA-256). object_key must be scoped under the caller's tenant prefix. Content-Type
        enforcement is handled by S3 at upload time (see PresignSignature); this endpoint
        re-reads the object to compute the hash, so any content that reached S3 has
        already passed the MIME check. expected_version is an optional optimistic-concurrency
        token — if supplied and it does not match the current record_version the request
        is rejected with 409. **Strict JSON binding:** unknown fields in the request
        body return 400 BAD_REQUEST.
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Object key, expected hash, and optional expected_version for
          optimistic concurrency
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ConfirmSignatureRequest'
      produces:
      - application/json
      responses:
        "200":
          description: signature replaced
          schema:
            $ref: '#/definitions/http.SignatureConfirmResponse'
        "201":
          description: signature created (first upload)
          schema:
            $ref: '#/definitions/http.SignatureConfirmResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "409":
          description: version_conflict, or signature_erasure_pending — the previous
            signature is still being erased
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "413":
          description: uploaded object exceeds 1 MB limit
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "422":
          description: input validation failed (hash format, or object_key is not
            the key issued by presign for this user)
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemDetails'
      security:
      - UserID: []
      - TenantID: []
      summary: Confirm signature upload
      tags:
      - Signature
  /users:batch:
    post:
      consumes:
      - application/json
      description: 'Returns profiles for up to 200 user IDs for any member of the
        same tenant (§5.3 — required for dashboards and assignee pickers). IDs with
        no matching user are listed in the "missing" array. The response includes
        a cursor-based pagination envelope (limit = IDs requested, total = profiles
        found, next_cursor omitted for ID-based batch). Rate limiting: 20 req/s sustained
        per user per replica (burst: 5). X-RateLimit-Limit reports the per-replica
        steady-state rate; effective global limit scales with replica count (see HPA
        config). X-RateLimit-Limit, X-RateLimit-Remaining, and X-RateLimit-Reset headers
        are set on every response.'
      parameters:
      - description: Array of user UUIDs (max 200)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.BatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Sustained requests per second per replica (not global)
              type: integer
            X-RateLimit-Remaining:
              description: Remaining tokens in the current window
              type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the bucket is fully replenished
              type: integer
          schema:
            $ref: '#/definitions/http.BatchUsersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "429":
          description: rate limited
          headers:
            X-RateLimit-Limit:
              description: Sustained requests per second per replica
              type: integer
            X-RateLimit-Remaining:
              description: Remaining tokens (0 when rate-limited)
              type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the limit resets
              type: integer
          schema:
            $ref: '#/definitions/http.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemDetails'
      security:
      - UserID: []
      - TenantID: []
      summary: Batch get user profiles
      tags:
      - Users
securityDefinitions:
  TenantID:
    description: Tenant UUID injected by the API gateway.
    in: header
    name: x-tenant-id
    type: apiKey
  TenantRoles:
    description: Comma-separated role list injected by the API gateway. Internal endpoints
      require the "iam-system" role.
    in: header
    name: x-tenant-roles
    type: apiKey
    x-ratelimit: '{"default":"100 req/min","burst":5,"scope":"per-user (keyed by x-user-id;
      each caller gets an independent token bucket)","headers":{"X-RateLimit-Limit":"Maximum
      requests per burst window","X-RateLimit-Remaining":"Remaining requests in the
      current window","X-RateLimit-Reset":"Unix timestamp when the limit fully resets"},"notes":"POST
      /users/batch enforces 20 req/s with burst=5 per caller (x-user-id). Idle per-user
      buckets are evicted after 1 hour. Rate-limited requests return HTTP 429."}'
  UserID:
    description: Authenticated user UUID injected by the API gateway.
    in: header
    name: x-user-id
    type: apiKey
swagger: "2.0"
x-rateLimit:
  default: 100 req/min
  burst: 5
  scope: per-process (shared across connections on the same replica)
  headers:
    X-RateLimit-Limit: Maximum requests per burst window
    X-RateLimit-Remaining: Remaining requests in the current window
    X-RateLimit-Reset: Unix timestamp when the limit fully resets
  notes: POST /users/batch enforces an additional 20 req/s token-bucket limit per process. Rate-limited requests return HTTP 429.
x-events:
  topic: iam.user.events
  transport: AWS SNS → SQS (fan-out via subscription filter on event_type MessageAttribute)
  wireFormat: 18-byte AWS Glue header + JSON payload (see api/asyncapi.yaml for full schema)
  filterAttribute: event_type
  seeAlso: api/asyncapi.yaml
  envelope:
    id: uuid — event_id (RFC 4122 UUID v7, time-ordered, 128-bit, monotonically ordered at publish time; use as idempotency key and primary sort key)
    type: "string (event type — see events[].type)"
    subject: uuid (user_id this event is about)
    source: "string (always 'iam-user-profile')"
    tenant_id: uuid
    time: "date-time (emitted_at — UTC time envelope was created; use for ordering and replay windowing; CloudEvents 'time' field)"
    actor: "string (user_id of the authenticated caller, or 'iam-system' for background workers)"
    trace_id: string (OTel W3C trace ID — links event to originating request across all services; omitted for background workers)
    correlation_id: string (OTel span ID of the producing handler — use with trace_id to pin the exact span; omitted for background workers)
    specversion: "string (always '1' — message format semantic version; CloudEvents 'specversion' field)"
    dataschema: "uuid (Glue schema version UUID — omitted when NoopCodec is active; CloudEvents 'dataschema' field)"
    ip_address: string (client IP — available via platform-events WithIPAddress; NOT set by this service — GDPR)
    user_agent: string (HTTP User-Agent — available via platform-events WithUserAgent; NOT set by this service — GDPR)
  replayGuidance:
    delivery: at-least-once — SNS → SQS guarantees at-least-once delivery; duplicate messages will occur
    idempotency: Consumers MUST use envelope.id (RFC 4122 UUID v7) as an idempotency key — record processed IDs before committing side-effects and discard any message whose id has already been processed
    ordering: "No global ordering guarantee across subjects. Within a subject (user_id): use envelope.id (RFC 4122 UUID v7, time-ordered, 128-bit — monotonically ordered by creation time) as the primary sort key; use envelope.time as a human-readable secondary tiebreaker. If a stored id > incoming id for the same subject, the incoming message is stale — discard it."
    replay:
      1_dlq_redrive: SQS DLQ redrive (broker-level, recent failures only) — move failed messages back via SQS StartMessageMoveTask API; covers delivery/processing failures within the SQS retention window (default 4 days)
      2_outbox_replay: Outbox-based replay (within 7-day retention window) — contact the IAM team with scope (id, subject, event_type + time range); they re-enqueue from the outbox with new ids so consumer idempotency keys are not bypassed
      3_rest_backfill: "State-based backfill (recommended for new consumers or full recovery) — bootstrap from GET /internal/users?tenant_id={id} or GET /users/{id} snapshots, then subscribe to future events; no synthetic events are published during backfill"
      4_no_event_store: No event store / time-travel — arbitrary historical replay is not supported; consumers requiring durable event history should archive received events in their own store (e.g. S3 + Athena)
    seeAlso: api/asyncapi.yaml — full ordering, idempotency, DLQ, and replay guidance in the iam.user.events channel description
  events:
    - type: UserProvisioned
      trigger: POST /internal/users — first-time user row creation
      payload:
        user_id: uuid
        email: string
        username: string (omitempty)
        source: "string (keycloak | manual)"
        created_at: date-time
      consumers:
        - queue: user-audit-q
          dlq: user-audit-q-dlq
          service: Audit Log Service
          filter: all event types
    - type: UserUpdated
      trigger: "PATCH /users/{id} or PATCH /internal/users/{id} — any profile field changed"
      payload:
        user_id: uuid
        changed_fields: "array — values: display_name, job_title, timezone, locale, phone, credentials, email, username, signature_key, signature_image_hash, preferred_model, writing_tone, templates, context_documents, notification_preferences"
        email: string (omitempty — present only when changed_fields contains email)
      consumers:
        - queue: user-audit-q
          dlq: user-audit-q-dlq
          service: Audit Log Service
          filter: all event types
        - queue: user-authz-q
          dlq: user-authz-q-dlq
          service: AuthZ Enrichment
          filter: "event_type IN [UserUpdated, UserAvailabilityChanged, UserDeleted]"
    - type: UserStatusChanged
      trigger: "PATCH /internal/users/{id} with a status change (active <-> disabled; alongside UserUpdated) or DELETE /internal/users/{id} (-> deleted; alongside UserDeleted, also per user of a TenantOffboarded scrub)"
      payload:
        user_id: uuid
        previous_status: "active | disabled | deleted"
        new_status: "active | disabled | deleted"
      consumers:
        - queue: user-audit-q
          dlq: user-audit-q-dlq
          service: Audit Log Service
          filter: all event types
        - queue: delegation-cascade-q
          dlq: delegation-cascade-q-dlq
          service: Delegation Service
          filter: "event_type IN [UserStatusChanged] — acts on new_status=disabled"
    - type: UserAvailabilityChanged
      trigger: "PUT /users/{id}/availability — availability status or OOO window changed"
      payload:
        user_id: uuid
        status: "available | busy | ooo"
        ooo_from: date-time (omitempty)
        ooo_until: date-time (omitempty)
        delegate_user_id: uuid (omitempty)
      consumers:
        - queue: user-audit-q
          dlq: user-audit-q-dlq
          service: Audit Log Service
          filter: all event types
        - queue: user-authz-q
          dlq: user-authz-q-dlq
          service: AuthZ Enrichment
          filter: "event_type IN [UserUpdated, UserAvailabilityChanged, UserDeleted]"
        - queue: user-wf-q
          dlq: user-wf-q-dlq
          service: Workflow Service
          filter: "event_type IN [UserAvailabilityChanged, UserDeleted]"
    - type: UserDeleted
      trigger: "DELETE /internal/users/{id} — user soft-deleted"
      payload:
        user_id: uuid
        deleted_at: date-time
      consumers:
        - queue: user-audit-q
          dlq: user-audit-q-dlq
          service: Audit Log Service
          filter: all event types
        - queue: user-authz-q
          dlq: user-authz-q-dlq
          service: AuthZ Enrichment
          filter: "event_type IN [UserUpdated, UserAvailabilityChanged, UserDeleted]"
        - queue: user-wf-q
          dlq: user-wf-q-dlq
          service: Workflow Service
          filter: "event_type IN [UserAvailabilityChanged, UserDeleted]"
