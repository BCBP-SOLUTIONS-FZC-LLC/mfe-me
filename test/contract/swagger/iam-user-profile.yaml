      created_at:
        example: "2026-01-01T00:00:00Z"
        format: date-time
        type: string
      credentials:
        additionalProperties:
          type: string
        example:
          department: Engineering
          employee_id: E-1042
          org: BCBP
        type: object
      display_name:
        example: Alice Smith
        type: string
      display_name_overridden:
        example: true
        type: boolean
      email:
        example: alice.smith@acmecorp.com
        type: string
      id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        format: uuid
        type: string
      job_title:
        example: Senior Engineer
        type: string
      job_title_overridden:
        example: false
        type: boolean
      locale:
        example: en-US
        type: string
      phone:
        example: "+12125551234"
        type: string
      provisional:
        example: false
        type: boolean
      record_version:
        example: 3
        type: integer
      source:
        example: local
        type: string
      status:
        example: active
        type: string
      tenant_id:
        example: f0e1d2c3-b4a5-6789-0fed-cba987654321
        format: uuid
        type: string
      timezone:
        example: America/New_York
        type: string
      updated_at:
        example: "2026-06-01T12:00:00Z"
