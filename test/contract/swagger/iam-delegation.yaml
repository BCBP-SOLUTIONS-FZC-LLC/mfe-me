definitions:
  github_com_BCBP-SOLUTIONS-FZC-LLC_platform-gincommon_v2_internal_problem.FieldError:
    properties:
      field:
        description: Field is the JSON path of the invalid field (e.g. "deadline",
          "items[0].sku").
        type: string
      message:
        description: |-
          Message is a fixed phrase ("is required", "must be in the future"). It never
          echoes the rejected value, which may be PII.
        type: string
    type: object
  http.ActiveDelegationView:
    properties:
      delegate_id:
        type: string
      delegation_id:
        type: string
      delegator_id:
        type: string
      ends_at:
        type: string
      scope:
        type: string
      scope_id:
        format: uuid
        type: string
    type: object
  http.ActiveDelegationsResponse:
    properties:
      active_delegations:
        items:
          $ref: '#/definitions/http.ActiveDelegationView'
        type: array
    type: object
  http.DelegationCreateRequest:
    properties:
      delegate_id:
        type: string
      ends_at:
        type: string
      ooo_note:
        type: string
      scope:
        type: string
      scope_id:
        format: uuid
        type: string
      starts_at:
        type: string
    type: object
  http.DelegationExtendRequest:
    properties:
      extend_days:
        type: integer
      record_version:
        type: integer
    type: object
  http.DelegationExtendResponse:
    properties:
      delegation_id:
        type: string
      record_version:
        type: integer
      review_due_at:
        type: string
      review_last_warned_bucket:
        type: integer
    type: object
  http.DelegationListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/http.DelegationResponse'
        type: array
    type: object
  http.DelegationReassignRequest:
    properties:
      ends_at:
        type: string
      new_delegate_id:
        format: uuid
        type: string
      reason:
        type: string
      record_version:
        type: integer
      scope:
        type: string
      scope_id:
        format: uuid
        type: string
    type: object
  http.DelegationResponse:
    properties:
      delegate_id:
        type: string
      delegation_id:
        type: string
      delegator_id:
        type: string
      ends_at:
        type: string
      record_version:
        type: integer
      review_due_at:
        type: string
      review_last_warned_bucket:
        type: integer
      review_window_days:
        type: integer
      scope:
        type: string
      scope_id:
        format: uuid
        type: string
      starts_at:
        type: string
      status:
        type: string
    type: object
  http.DeptDelegateResponse:
    properties:
      delegate_id:
        format: uuid
        type: string
      delegation_id:
        format: uuid
        type: string
      delegator_id:
        format: uuid
        type: string
      found:
        type: boolean
    type: object
  http.ExpiryRunResponse:
    properties:
      attempted:
        type: integer
      failed:
        type: integer
      succeeded:
        type: integer
    type: object
  http.ProblemResponse:
    properties:
      detail:
        description: |-
          Detail is a sentence the service wrote about this occurrence. It never
          carries exception text, SQL, secrets or tenant information.
        type: string
      errorCode:
        description: ErrorCode is the stable, upper snake case, machine-readable code.
        type: string
      instance:
        description: Instance is the request path (never the query string, which may
          carry tokens).
        type: string
      status:
        description: Status is the HTTP status code; it always equals the response
          status.
        type: integer
      tenantId:
        description: TenantID is set only for a request with a verified tenant context.
        type: string
      timestamp:
        description: Timestamp is when the problem was created, formatted with TimestampLayout.
        type: string
      title:
        description: Title is the short, fixed summary of the type. It never varies
          per occurrence.
        type: string
      traceId:
        description: TraceID correlates the response with the server's logs and traces.
        type: string
      type:
        description: |-
          Type is the absolute, stable type URI ({base}/{domain}/{error}), or
          "about:blank" for a status without a registered type (RFC 9457 §4.2.1).
        type: string
      validationErrors:
        description: ValidationErrors lists the invalid fields of a validation-failed
          problem.
        items:
          $ref: '#/definitions/github_com_BCBP-SOLUTIONS-FZC-LLC_platform-gincommon_v2_internal_problem.FieldError'
        type: array
    type: object
  http.ReviewSweepRunResponse:
    properties:
      deferred:
        type: integer
      expired:
        type: integer
      failed:
        type: integer
      warned_1d:
        description: days_remaining=1
        type: integer
      warned_2d:
        description: days_remaining=2
        type: integer
      warned_3d:
        description: days_remaining=3
        type: integer
    type: object
  http.SettingsResponse:
    properties:
      max_duration_days:
        type: integer
      record_version:
        type: integer
      review_window_days:
        type: integer
    type: object
  http.SettingsSetRequest:
    properties:
      max_duration_days:
        type: integer
      review_window_days:
        type: integer
    type: object
info:
  contact:
    name: BCBP Solutions
  description: |-
    The system of record for out-of-office (OOO) delegations — time-bounded grants that drive workflow rerouting. Extracted from iam-org-membership per ADR-0008 (Option C), the fourth and last O&M decomposition wave.

    **Route prefixes.**  `/api/v1/delegations*` — tenant callers (self or `tenant_admin`/`tenant_owner` via `x-tenant-roles`, gateway-injected identity).  `/internal/*` — in-mesh service-to-service, mTLS trust boundary only, no RBAC/JWT check at all (LLD §8.2/§13.2).

    DLG-2 (create) requires an `Idempotency-Key` header; a repeated key within 24h returns the original 201 rather than creating a second delegation (DLG-D8).
  license:
    name: Proprietary
  title: Delegation Service API
  version: "1.0"
paths:
  /api/v1/delegations:
    get:
      description: Returns the caller's own active delegations (RLS-scoped, LLD §9.1).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.DelegationListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: DLG-1 — List active delegations
      tags:
      - delegations
    post:
      consumes:
      - application/json
      description: 'Availability-first (LLD §11.1): calls User Profile SetAvailability
        BEFORE inserting the delegations row. Requires the Idempotency-Key header
        (DLG-Q3) — a repeat within 24h returns the original 201.'
      parameters:
      - description: Idempotency key, required
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Delegation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.DelegationCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.DelegationResponse'
        "400":
          description: VALIDATION_FAILED (malformed body or field type, platform type)
            | validation_error (missing Idempotency-Key)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "409":
          description: idempotency_key_in_flight
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "413":
          description: PAYLOAD_TOO_LARGE — body over 1 MiB
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "422":
          description: idempotency_key_reused | self_delegation | invalid_delegate
            | delegate_unavailable | scope_id_required | invalid_scope_id | invalid_delegation_scope
            | reason_too_long | delegation_window_inverted | delegation_window_too_long
            | delegation_start_in_past | delegation_start_too_far_future
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "503":
          description: org_membership_unavailable | user_profile_unavailable | catalog_admin_unavailable
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: DLG-2 — Create OOO delegation
      tags:
      - delegations
  /api/v1/delegations/{id}:
    delete:
      description: 'Pointer-clear-only, fail-open on User Profile (LLD §11.2): calls
        UP {delegate_id:null} first, then flips status to ''cancelled''. Self-service;
        tenant_admin/tenant_owner can cancel any.'
      parameters:
      - description: Delegation UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Optimistic-lock version (must be ≥ 1)
        in: query
        name: record_version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.DelegationResponse'
        "400":
          description: validation_error — record_version missing or ≤ 0
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "409":
          description: optimistic_lock_conflict
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: DLG-3 — Cancel delegation
      tags:
      - delegations
  /api/v1/delegations/{id}/extend:
    post:
      consumes:
      - application/json
      description: Pushes review_due_at forward and resets review_last_warned_bucket
        to NULL, re-arming the 3-day daily cascade. Open-ended delegations only (422
        not_review_tracked otherwise).
      parameters:
      - description: Delegation UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: extend_days + record_version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.DelegationExtendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.DelegationExtendResponse'
        "400":
          description: VALIDATION_FAILED (malformed body or field type, platform type)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "409":
          description: optimistic_lock_conflict
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "413":
          description: PAYLOAD_TOO_LARGE — body over 1 MiB
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "422":
          description: not_review_tracked | extend_days_out_of_range
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: DLG-4 — Extend delegation review window
      tags:
      - delegations
  /api/v1/delegations/{id}/reassign:
    post:
      consumes:
      - application/json
      description: Ends the current delegation (status=ended) then creates a new one
        via the full DLG-2 pre-flight, including both membership checks. All body
        fields optional, each defaulting to the current delegation's value. At least
        one field must differ from the current delegation — a fully-identical request
        returns 422 invalid_delegate (no-op guard). On a Create failure after the
        old one is ended, the old delegation is NOT resurrected. record_version must
        be ≥ 1.
      parameters:
      - description: Delegation UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Reassignment payload (record_version required)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.DelegationReassignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.DelegationResponse'
        "400":
          description: VALIDATION_FAILED (malformed body or field type, platform type)
            | validation_error — record_version missing or ≤ 0
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "409":
          description: optimistic_lock_conflict
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "413":
          description: PAYLOAD_TOO_LARGE — body over 1 MiB
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "422":
          description: 'invalid_delegate (no-op: no fields changed; or invalid/inactive
            delegate) | delegate_unavailable | self_delegation | scope_id_required
            | invalid_scope_id'
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: DLG-5 — Reassign delegation to a new delegate
      tags:
      - delegations
  /api/v1/delegations/settings:
    get:
      description: Returns the 90/90 default when the tenant has no persisted delegation_tenant_settings
        row.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: DLG-6 — Get tenant delegation policy
      tags:
      - delegations
    put:
      consumes:
      - application/json
      description: Both fields required, each in [1,180]. Upserts the tenant's delegation_tenant_settings
        row.
      parameters:
      - description: Policy payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.SettingsSetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SettingsResponse'
        "400":
          description: VALIDATION_FAILED (malformed body or field type, platform type)
            | invalid_delegation_max_duration_days | invalid_delegation_review_window_days
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ProblemResponse'
        "413":
          description: PAYLOAD_TOO_LARGE — body over 1 MiB
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: DLG-7 — Set tenant delegation policy
      tags:
      - delegations
  /asyncapi:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "401":
          description: UNAUTHORIZED — production docs bearer gate (DOCS_AUTH_TOKEN)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      summary: AsyncAPI catalog viewer
      tags:
      - infra
  /asyncapi.yaml:
    get:
      produces:
      - application/yaml
      responses:
        "200":
          description: AsyncAPI YAML
          schema:
            type: string
        "401":
          description: UNAUTHORIZED — production docs bearer gate (DOCS_AUTH_TOKEN)
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      summary: Raw AsyncAPI spec
      tags:
      - infra
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: always {\"status\":\"ok\"}
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - infra
  /internal/delegations/dept-delegate:
    get:
      description: Mesh-only. Backs Core's synchronous removal-gate call (LLD §11.5)
        — never 404; found:false is the valid "no active department delegation" answer.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: query
        name: tenant_id
        required: true
        type: string
      - description: User UUID
        format: uuid
        in: query
        name: user_id
        required: true
        type: string
      - description: Department UUID
        format: uuid
        in: query
        name: dept_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.DeptDelegateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      summary: DLG-I3 — Find the active department-scope delegate for a user
      tags:
      - internal
  /internal/delegations/expire:
    post:
      description: Mesh-only. Ends every active fixed-ends_at delegation whose window
        has passed, UP pointer-clear first (fail-open per-row, DEL-6).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ExpiryRunResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      summary: DLG-I1 — Run the delegation-expiry sweep
      tags:
      - internal
  /internal/delegations/review-sweep:
    post:
      description: Mesh-only. Daily cascade warn pass over open-ended delegations
        (days_remaining ∈ {3,2,1}), then an auto-end pass for those whose review_due_at
        has passed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ReviewSweepRunResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      summary: DLG-I2 — Run the delegation review-window sweep
      tags:
      - internal
  /internal/users/{id}/active-delegations:
    get:
      description: Mesh-only. Returns the delegations the given user has handed out
        (delegator side, active).
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Tenant UUID
        format: uuid
        in: query
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ActiveDelegationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ProblemResponse'
      summary: DLG-I4 — List a user's active outbound delegations
      tags:
      - internal
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness check
      tags:
      - infra
tags:
- description: Out-of-office delegation lifecycle — DLG-1..7 (list, create, cancel, extend, reassign, settings get/set)
  name: delegations
- description: Mesh-only internal API — DLG-I1..I4 (expiry sweep, review sweep, dept-delegate lookup, active-delegations escape-hatch)
  name: internal
- description: "Health & readiness probes + AsyncAPI viewer (unauthenticated)"
  name: infra
securityDefinitions:
  TenantID:
    description: Tenant UUID injected by the API gateway.
    in: header
    name: x-tenant-id
    type: apiKey
  TenantRoles:
    description: Comma-separated tenant-role list injected by the API gateway. DLG-3/4/5
      accept self or tenant_admin/tenant_owner; DLG-7 requires tenant_admin/tenant_owner.
    in: header
    name: x-tenant-roles
    type: apiKey
  UserID:
    description: Authenticated user UUID injected by the API gateway. Required on
      /api/v1/* routes only — /internal/* is mesh-only and carries no identity headers.
    in: header
    name: x-user-id
    type: apiKey
swagger: "2.0"
