      ooo_from:
        example: "2026-07-01T00:00:00Z"
        format: date-time
        type: string
      ooo_until:
        example: "2026-07-14T23:59:59Z"
        format: date-time
        type: string
      status:
        allOf:
        - $ref: '#/definitions/http.AvailabilityStatus'
        example: ooo
    required:
    - status
    type: object
  http.PutLLMPrefsRequest:
    properties:
      context_documents:
        items:
          type: string
        maxItems: 10
        type: array
      expected_version:
        example: 1
        minimum: 1
        type: integer
      preferred_model:
        example: claude-opus-4-7
        maxLength: 128
        minLength: 1
        type: string
      templates:
        items:
          type: string
        maxItems: 20
        type: array
      writing_tone:
        allOf:
        - $ref: '#/definitions/http.WritingTone'
        example: technical
    type: object
  http.PutNotifPrefsRequest:
    properties:
      preferences:
        description: |-
          min=0 intentional: an empty array clears all preferences (user opts into
          system defaults for every event type). min=1 would prevent that.
        items:
          $ref: '#/definitions/http.NotifPrefItem'
        maxItems: 50
        minItems: 0
        type: array
    required:
    - preferences
    type: object
  http.SignatureConfirmResponse:
    properties:
      signature_image_hash:
        example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        type: string
      signature_key:
        example: f0e1d2c3-b4a5-6789-0fed-cba987654321/signatures/sig.png
        type: string
      updated_at:
        example: "2026-06-01T12:00:00Z"
        format: date-time
        type: string
      user_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        format: uuid
