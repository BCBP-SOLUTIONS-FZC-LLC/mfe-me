        example:
        - '["email"'
        - '"in_app"]'
        items:
          type: string
        type: array
      event_type:
        example: document.approved
        maxLength: 100
        type: string
      urgency_threshold:
        allOf:
        - $ref: '#/definitions/http.UrgencyThreshold'
        example: normal
    type: object
  http.NotifPrefItemResponse:
    properties:
      channels:
        example:
        - '["email"'
        - '"in_app"]'
        items:
          type: string
        type: array
      event_type:
        example: document.approved
        type: string
      urgency_threshold:
        allOf:
        - $ref: '#/definitions/http.UrgencyThreshold'
        example: normal
    type: object
  http.NotifPrefsListResponse:
    properties:
      preferences:
        items:
          $ref: '#/definitions/http.NotifPrefItemResponse'
        type: array
    type: object
  http.PaginationMeta:
    properties:
      limit:
        example: 20
        type: integer
      next_cursor:
        example: eyJpZCI6ImFiYzEyMyJ9
        type: string
      total:
        example: 42
        type: integer
    type: object
  http.PatchIdentityRequest:
    properties:
      credentials:
        additionalProperties:
          type: string
        example:
          department: Engineering
          employee_id: E-1042
          org: BCBP
        type: object
      delete_credentials:
        example:
        - certifications
        items:
          type: string
        maxItems: 100
        type: array
      display_name:
        example: Alice Smith
        maxLength: 200
        type: string
      email:
        example: alice.smith@acmecorp.com
        maxLength: 254
        type: string
      event_time:
        description: |-
          EventTime is the source webhook's CloudEvents timestamp used by the
          LLD §8.8.16 recency guard. Intended for Event Consumer forwarding only;
          direct callers should omit. Stale values (<= users.last_idp_sync_at)
          silently no-op the patch and set X-IdP-Sync-Skipped: true on the response.
        example: "2026-06-01T12:00:00Z"
        format: date-time
        type: string
      job_title:
        example: Staff Engineer
        maxLength: 200
        type: string
      status:
        example: disabled
        maxLength: 20
        type: string
      username:
        example: alice_smith
        maxLength: 64
        minLength: 3
        type: string
    type: object
  http.PatchUserRequest:
    properties:
      credentials:
        additionalProperties:
          type: string
        example:
          certifications: AWS-SAA
        type: object
      delete_credentials:
        example:
        - certifications
        items:
          type: string
        maxItems: 100
        type: array
      display_name:
        example: Alice Smith
        maxLength: 200
        type: string
      display_name_overridden:
        example: true
        type: boolean
      expected_version:
        example: 2
        minimum: 1
        type: integer
      job_title:
        example: Staff Engineer
        maxLength: 200
        type: string
      job_title_overridden:
        example: false
        type: boolean
      locale:
        example: en-US
        maxLength: 20
        minLength: 2
        type: string
      phone:
        example: "+12125551234"
        type: string
      timezone:
        example: America/New_York
        maxLength: 64
        minLength: 1
        type: string
    type: object
  http.PresignRequest:
    properties:
      byte_size:
        example: 48213
        maximum: 1048576
        minimum: 1
        type: integer
      content_type:
        allOf:
        - $ref: '#/definitions/http.SignatureContentType'
        example: image/png
    required:
    - byte_size
    - content_type
    type: object
  http.PresignResponse:
    properties:
      expires_in:
        example: 300
        type: integer
      object_key:
        example: f0e1d2c3-b4a5-6789-0fed-cba987654321/signatures/sig.png
        type: string
      upload_url:
        example: https://s3.amazonaws.com/bucket/key?X-Amz-Signature=...
        type: string
    type: object
  http.ProblemDetails:
    properties:
      detail:
        description: |-
          Detail is a sentence the service wrote about this occurrence. It never
          carries exception text, SQL, secrets or tenant information.
        type: string
      errorCode:
        description: ErrorCode is the stable, upper snake case, machine-readable code.
        type: string
      instance:
        description: Instance is the request path (never the query string, which may
          carry tokens).
        type: string
      status:
        description: Status is the HTTP status code; it always equals the response
          status.
        type: integer
      tenantId:
        description: TenantID is set only for a request with a verified tenant context.
        type: string
      timestamp:
        description: Timestamp is when the problem was created, formatted with TimestampLayout.
        type: string
      title:
        description: Title is the short, fixed summary of the type. It never varies
          per occurrence.
        type: string
      traceId:
        description: TraceID correlates the response with the server's logs and traces.
        type: string
      type:
        description: |-
          Type is the absolute, stable type URI ({base}/{domain}/{error}), or
          "about:blank" for a status without a registered type (RFC 9457 §4.2.1).
        type: string
      validationErrors:
        description: ValidationErrors lists the invalid fields of a validation-failed
          problem.
        items:
          $ref: '#/definitions/github_com_BCBP-SOLUTIONS-FZC-LLC_platform-gincommon_v2_internal_problem.FieldError'
        type: array
    type: object
  http.ProvisionRequest:
    properties:
      credentials:
        additionalProperties:
          type: string
        example:
          department: Engineering
          employee_id: E-1042
          org: BCBP
        type: object
      display_name:
        example: Alice Smith
        maxLength: 200
        type: string
      email:
        example: alice.smith@acmecorp.com
        maxLength: 254
        type: string
      event_time:
        description: |-
          EventTime is the Keycloak webhook envelope timestamp forwarded by iam-event-consumer.
          When provided, it seeds users.last_idp_sync_at so the recency guard in PatchIdentity
          is effective from the very first provision (EC-4 fix). Optional — direct callers
          (manual tests, ad-hoc integrations) should omit it.
        example: "2026-06-01T12:00:00Z"
        format: date-time
        type: string
      job_title:
        example: Senior Engineer
        maxLength: 200
        type: string
      saml_attributes:
        additionalProperties:
          type: string
        description: 'accepted and ignored (LLD §5.4 #15)'
        type: object
      source:
        example: local
        type: string
      tenant_id:
        example: f0e1d2c3-b4a5-6789-0fed-cba987654321
        format: uuid
        type: string
      user_id:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        format: uuid
        type: string
      username:
        example: alice_smith
        maxLength: 64
        minLength: 3
        type: string
    required:
    - email
    - tenant_id
    - user_id
    type: object
  http.PutAvailabilityRequest:
    properties:
      delegate_user_id:
        example: b2c3d4e5-f6a7-8901-bcde-f12345678901
